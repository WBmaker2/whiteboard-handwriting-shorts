name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPYCACHEPREFIX: /tmp/whiteboard-handwriting-shorts-pycache

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Check required system tools
        run: |
          git --version
          ffmpeg -version
          ffprobe -version

      - name: Compile Python scripts
        run: python -m compileall -q scripts

      - name: Lint Python scripts
        run: ruff check --select E4,E7,E9,F,I scripts

      - name: Run bootstrap integration tests
        run: python scripts/test_bootstrap_runtime.py

      - name: Validate distribution package
        run: python scripts/validate_distribution.py
